services:
  postgres:
    image: postgres:16-alpine
    container_name: marquesuahora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marquesuahora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VS_nMw5Fsv97nNfmT04xbQp8PbfJbMdF}
      POSTGRES_DB: ${POSTGRES_DB:-marquesuahora_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marquesuahora} -d ${POSTGRES_DB:-marquesuahora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marquesuahora-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-8c584b308c8777897fb6a5ccbab77a7827966554c0507c6e1ec858580ad3ebe4}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-8c584b308c8777897fb6a5ccbab77a7827966554c0507c6e1ec858580ad3ebe4}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:v2.3.6
    container_name: marquesuahora-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: evolution_secret_key_123
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: "postgresql://marquesuahora:VS_nMw5Fsv97nNfmT04xbQp8PbfJbMdF@postgres:5432/marquesuahora_db?schema=evolution"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      REDIS_ENABLED: "true"
      REDIS_URI: "redis://:8c584b308c8777897fb6a5ccbab77a7827966554c0507c6e1ec858580ad3ebe4@redis:6379"
      CONFIG_SESSION_PHONE_CLIENT: "MarqueSuaHora"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      DEL_INSTANCE_ON_DISCONNECT: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  evolution_store:

